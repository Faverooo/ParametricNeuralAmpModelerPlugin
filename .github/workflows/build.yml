name: Build VST3

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate Core revision
        shell: bash
        env:
          CORE_SHA: ${{ vars.PNAM_CORE_SHA }}
        run: |
          if [[ ! "$CORE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Set the repository Actions variable PNAM_CORE_SHA to the full commit SHA of the published PNAM Core."
            exit 1
          fi
      - name: Check out PNAM Core
        uses: actions/checkout@v4
        with:
          repository: Faverooo/ParametricNeuralAmpModelerCore
          ref: ${{ vars.PNAM_CORE_SHA }}
          path: core
          submodules: recursive
          persist-credentials: false
      - name: Check out JUCE 8.0.6
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.6
          path: ci-juce
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfreetype-dev libfontconfig1-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev libgl1-mesa-dev
      - run: cmake -S . -B build -DPNAM_CORE_DIR="${{ github.workspace }}/core" -DPNAM_JUCE_DIR=ci-juce -DCMAKE_BUILD_TYPE=Release
        shell: bash
      - run: cmake --build build --config Release --target ParametricNAM_VST3 test_level_match --parallel 2
      - run: ctest --test-dir build -C Release --output-on-failure
      - name: Package VST3
        shell: bash
        env:
          ARCHIVE: ParametricNAM-VST3-${{ runner.os }}-${{ runner.arch }}.zip
        run: |
          mkdir package
          bundle="build/ParametricNAM_artefacts/Release/VST3/ParametricNAM.vst3"
          test -d "$bundle"
          cp -R "$bundle" README.md package/
          git -C core rev-parse HEAD > package/CORE_REVISION.txt
          cp core/LICENSE package/LICENSE-Core.txt
          cp ci-juce/LICENSE.md package/LICENSE-JUCE.md
          (cd package && cmake -E tar cf "../$ARCHIVE" --format=zip ParametricNAM.vst3 README.md CORE_REVISION.txt LICENSE-Core.txt LICENSE-JUCE.md)
      - uses: actions/upload-artifact@v4
        with:
          name: VST3-${{ runner.os }}-${{ runner.arch }}
          path: ParametricNAM-VST3-*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: VST3-*
          path: packages
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create --repo "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" --verify-tag --generate-notes packages/*.zip
