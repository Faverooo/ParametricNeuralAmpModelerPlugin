name: Build VST3

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate Core revision
        shell: bash
        env:
          CORE_SHA: ${{ vars.PNAM_CORE_SHA }}
        run: |
          if [[ ! "$CORE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Set the repository Actions variable PNAM_CORE_SHA to the full commit SHA of the published PNAM Core."
            exit 1
          fi
      - name: Check out PNAM Core
        uses: actions/checkout@v5
        with:
          repository: Faverooo/ParametricNeuralAmpModelerCore
          ref: ${{ vars.PNAM_CORE_SHA }}
          path: core
          submodules: recursive
          persist-credentials: false
      - name: Check out JUCE 8.0.6
        uses: actions/checkout@v5
        with:
          repository: juce-framework/JUCE
          ref: 8.0.6
          path: ci-juce
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfreetype-dev libfontconfig1-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev libgl1-mesa-dev libcurl4-openssl-dev
      - name: Configure CMake
        shell: bash
        env:
          PNAM_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set --
          if [[ "$RUNNER_OS" == macOS ]]; then
            set -- "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          fi
          cmake -S . -B build -DPNAM_CORE_DIR="$GITHUB_WORKSPACE/core" \
            -DPNAM_JUCE_DIR=ci-juce -DCMAKE_BUILD_TYPE=Release "-DPNAM_RELEASE_TAG=$PNAM_RELEASE_TAG" "$@"
      - run: cmake --build build --config Release --target ParametricNAM_VST3 test_level_match --parallel 2
      - run: ctest --test-dir build -C Release --output-on-failure
      - name: Stage VST3 and resolve installer version
        id: package
        shell: bash
        run: |
          version=$(sed -nE 's/^project\(ParametricNAM VERSION ([0-9]+\.[0-9]+\.[0-9]+) .*/\1/p' CMakeLists.txt)
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)([-+][0-9a-zA-Z.+-]+)?$ ]]; then
              version="${BASH_REMATCH[1]}"
            else
              echo "::error::Release tags must start with v followed by a version such as 0.1.0."
              exit 1
            fi
          fi
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p package installers-out
          cp -R build/ParametricNAM_artefacts/Release/VST3/ParametricNAM.vst3 package/
          resources="package/ParametricNAM.vst3/Contents/Resources"
          mkdir -p "$resources"
          git -C core rev-parse HEAD > "$resources/CORE_REVISION.txt"
          cp LICENSE "$resources/LICENSE-ParametricNAM.txt"
          cp core/LICENSE "$resources/LICENSE-Core.txt"
          cp ci-juce/LICENSE.md "$resources/LICENSE-JUCE.md"
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $iscc "/DPluginVersion=$env:VERSION" "/DBundleDir=$PWD\package\ParametricNAM.vst3" "/O$PWD\installers-out" installers/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build macOS installer
        if: runner.os == 'macOS'
        shell: bash
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          bundle="package/ParametricNAM.vst3"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$bundle/Contents/Info.plist")
          lipo -verify_arch arm64 x86_64 "$bundle/Contents/MacOS/$executable"
          codesign --force --sign - "$bundle"
          codesign --verify --deep --strict --all-architectures --verbose=2 "$bundle"
          pkgbuild --component "$bundle" \
            --identifier com.faverooo.parametricnam.vst3 --version "$VERSION" \
            --install-location /Library/Audio/Plug-Ins/VST3 \
            "installers-out/ParametricNAM-VST3-$VERSION-macOS-Universal.pkg"
      - name: Build and test Linux installer
        if: runner.os == 'Linux'
        shell: bash
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          archive="installers-out/ParametricNAM-VST3-$VERSION-Linux-$RUNNER_ARCH.run"
          cat installers/linux-installer.sh > "$archive"
          tar -C package -czf - ParametricNAM.vst3 >> "$archive"
          test_home=$(mktemp -d)
          HOME="$test_home" bash "$archive" --yes
          HOME="$test_home" bash "$archive" --yes
          diff -r package/ParametricNAM.vst3 "$test_home/.vst3/ParametricNAM.vst3"
      - uses: actions/upload-artifact@v6
        with:
          name: VST3-Installer-${{ runner.os }}-${{ runner.arch }}
          path: installers-out/
          if-no-files-found: error
      - name: Package portable build for testing
        if: github.ref_type != 'tag'
        shell: bash
        env:
          ARCHIVE: ParametricNAM-VST3-${{ runner.os }}-${{ runner.arch }}.zip
        run: |
          cp README.md LICENSE package/
          (cd package && cmake -E tar cf "../$ARCHIVE" --format=zip ParametricNAM.vst3 README.md LICENSE)
      - uses: actions/upload-artifact@v6
        if: github.ref_type != 'tag'
        with:
          name: VST3-Portable-${{ runner.os }}-${{ runner.arch }}
          path: ParametricNAM-VST3-*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: VST3-Installer-*
          path: packages
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create --repo "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" --verify-tag --generate-notes packages/*
